# Pre-flight teacher probe for P1-6 (num_epochs: 0 => step-0 teacher rollout only).
# Mirrors tasks_6task.yaml exactly; see slurm/verify_p1b_teachers.sh.
#   LiftCube  — grasp-and-lift (RL teacher, SR ~1.00). The existing four are all
#               contact-and-move; none involves lifting an object clear of the table.
#   OpenLid   — hinge-up (classical teacher, measured 1.000 over 128 episodes on
#               current HEAD via classical.test_classical).
#
# Both additions have near-perfect standalone teachers, which is what the TODO's
# competence-control requirement asks for: any retention loss at N=6 is then
# attributable to the continual-learning problem, not to a weak teacher.
#
# 500 epochs/task, same as the four-task runs, so per-task optimisation is unchanged
# and the only variable is sequence length.
tasks:
  PushCuboid:
    env_id: "Mjlab-Push-Cuboid-Franka"
    dataset_folder: "/ihub/homedirs/svs_ald/sudhir/mjlab/src/mjlab/continual_distill/teacher_datasets/Mjlab_Push_Cuboid_Franka_model_4000_20260129_060250"
    num_epochs: 0

