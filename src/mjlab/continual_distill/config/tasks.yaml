# Task definitions for continual distillation
#
# This file defines individual tasks that can be referenced in task sequences.
# Each task requires:
#   - task_name: Unique name for the task (used as identifier)
#   - env_id: mjlab environment ID
#   - dataset_folder: Folder containing data.pkl and teacher.pkl
#   - num_epochs: Number of epochs for this task
#
# Episode length, observation dimension, and action dimension are automatically
# retrieved from the environment configuration.
#
# The dataset_folder should contain:
#   - data.pkl: observations and action_targets
#   - teacher.pkl: JAX weights, normalizer, and architecture

tasks:
  PushCuboid:
    env_id: "Mjlab-Push-Cuboid-Franka"
    dataset_folder: "/media/cvlab/EXTDRIVE/sudhir/continual_learning/mjlab/src/mjlab/continual_distill/teacher_datasets/Mjlab_Push_Cuboid_Franka_model_4000_20260129_060250"
    num_epochs: 500

  OpenDoor:
    env_id: "Mjlab-Open-Door-Franka"
    dataset_folder: "/media/cvlab/EXTDRIVE/sudhir/continual_learning/mjlab/src/mjlab/continual_distill/teacher_datasets/Mjlab_Open_Door_Franka_model_1999_20260129_055421"
    num_epochs: 500

  OpenDrawer:
